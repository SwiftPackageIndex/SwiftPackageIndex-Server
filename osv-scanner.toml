# Configuration for the osv-scanner SBOM scan in .github/workflows/ci.yml.
#
# Any vulnerability osv-scanner reports fails CI. Only add an exception here when a finding
# has been reviewed and does not affect us, and always include a reason and an expiry date
# so it gets looked at again:
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2026-12-31
# reason = "Why this does not affect the Swift Package Index."
