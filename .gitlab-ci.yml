image: docker:stable

variables:
  REGISTRY_IMAGE: registry.gitlab.com/saguaro1/swift-package-index
  DOCKER_TLS_CERTDIR: "/certs"

services:
  - docker:stable-dind

before_script:
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY

stages:
  - build
  - deploy

build:
  stage: build
  script: |
    VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_SHA}
    echo "VERSION: $VERSION"
    echo 'let appVersion: String? = "'${VERSION}'"' > ./Sources/App/Core/AppVersion.swift

    make build-front-end

    # Login in again in case the previous steps were slow and made the token time out
    docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    docker build --build-arg COMPILATION_MODE=release -t $REGISTRY_IMAGE:$VERSION .

    retries=3
    until docker push $REGISTRY_IMAGE:$VERSION ; do
      [[ $retries -eq 0 ]] && echo "docker push failed" && exit 1
      sleep 5
      echo Retrying ...
      docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
      echo $((retries--)) retries left
    done
  tags:
    - service-builder
    - dev

deploy_to_dev:
  stage: deploy
  trigger:
    project: saguaro1/dev
    branch: main
    strategy: depend
  variables:
    DEPLOY_ENV: "dev"
    SPI_COMMIT_TAG: $CI_COMMIT_TAG
    SPI_COMMIT_SHA: $CI_COMMIT_SHA